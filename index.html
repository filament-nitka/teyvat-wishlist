<style id="css">

  --text:#1E2A55; --muted:#5A6893; --gold:#B8862A; --p4:#9A6AE0; --p4fg:#FFFFFF; --r5:#F2E2B8; --r5fg:#8A6A2A; --r4:#E2D6F5; --r4fg:#6A55A0; --r0:#E1E4EE; --r0fg:#6E7593; --ring5:#E3BE6E; --ring4:#C3B2EC; --focus:#3D63D6; --pink:#D2457A; --gemBg:#E3EEFF;

 8% 593px,rgba(255,196,220,.55),rgba(255,196,220,0) 70%) no-repeat,radial-gradient(210px 50px at calc(60% - 94px) 768px,rgba(255,255,255,.9),rgba(255,255,255,0) 70%) no-repeat,radial-gradient(168px 55px at 60% 760px,rgba(255,255,255,.95),rgba(255,255,255,0) 70%) no-repeat,radial-gradient(189px 40px at calc(60% + 105px) 772px,rgba(255,255,255,.85),rgba(255,255,255,0) 70%) no-repeat,radial-gradient(315px 35px at 60% 798px,rgba(255,196,220,.55),rgba(255,196,220,0) 70%) no-repeat; --mode:clouds;
  --shadow:0 2px 0 rgba(30,42,85,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101A3E; --panel:#18265A; --panel2:#1F2F6A; --line:#2E4183;
    --text:#F2EEE2; --muted:#A9B6DD; --gold:#F5C451; --p4:#B98BF0; --p4fg:#1E1640; --r5:#5E5640; --r5fg:#EBD9A8; --r4:#4D4670; --r4fg:#D6C8F2; --r0:#3A4170; --r0fg:#B9C0DE; --ring5:#CDB273; --ring4:#9C8CCB; --focus:#9FD0FF; --pink:#F08AB0; --gemBg:#2E3F7E;
    --tS:#F5C451; --tA:#B98BF0; --tB:#6FA3F5; --tC:#8FD3FF; --tD:#8E9BC4;
    --star:#FFFFFF; --glow1:rgba(90,140,255,.30); --glow2:rgba(170,120,255,.24); --glow3:rgba(245,196,81,.08);
    --sky:linear-gradient(180deg,#0F1940 0%,#172255 40%,#231F5C 75%,#2B2160 100%);
    --deco:radial-gradient(1px 1px at 17px 23px,rgba(255,255,255,.85) 50%,transparent 51%) 0 0/97px 97px,radial-gradient(1px 1px at 61px 7px,rgba(255,255,255,.6) 50%,transparent 51%) 0 0/131px 131px,radial-gradient(1.2px 1.2px at 33px 88px,rgba(255,255,255,.75) 50%,transparent 51%) 0 0/173px 173px,radial-gradient(1px 1px at 90px 41px,rgba(200,220,255,.7) 50%,transparent 51%) 0 0/113px 113px,radial-gradient(0.8px 0.8px at 5px 61px,rgba(255,255,255,.5) 50%,transparent 51%) 0 0/79px 79px,radial-gradient(1px 1px at 120px 140px,rgba(230,210,255,.7) 50%,transparent 51%) 0 0/197px 197px,radial-gradient(1.4px 1.4px at 150px 30px,rgba(255,245,220,.8) 50%,transparent 51%) 0 0/241px 241px,radial-gradient(0.8px 0.8px at 44px 12px,rgba(255,255,255,.45) 50%,transparent 51%) 0 0/61px 61px; --mode:stars;

  }
}
:root[data-theme="dark"]{
  --bg:#101A3E; --panel:#18265A; --panel2:#1F2F6A; --line:#2E4183;
  --text:#F2EEE2; --muted:#A9B6DD; --gold:#F5C451; --p4:#B98BF0; --p4fg:#1E1640; --r5:#5E5640; --r5fg:#EBD9A8; --r4:#4D4670; --r4fg:#D6C8F2; --r0:#3A4170; --r0fg:#B9C0DE; --ring5:#CDB273; --ring4:#9C8CCB; --focus:#9FD0FF; --pink:#F08AB0; --gemBg:#2E3F7E;
  --tS:#F5C451; --tA:#B98BF0; --tB:#6FA3F5; --tC:#8FD3FF; --tD:#8E9BC4;
  --star:#FFFFFF; --glow1:rgba(90,140,255,.30); --glow2:rgba(170,120,255,.24); --glow3:rgba(245,196,81,.08);
    --sky:linear-gradient(180deg,#0F1940 0%,#172255 40%,#231F5C 75%,#2B2160 100%);
    --deco:radial-gradient(1px 1px at 17px 23px,rgba(255,255,255,.85) 50%,transparent 51%) 0 0/97px 97px,radial-gradient(1px 1px at 61px 7px,rgba(255,255,255,.6) 50%,transparent 51%) 0 0/131px 131px,radial-gradient(1.2px 1.2px at 33px 88px,rgba(255,255,255,.75) 50%,transparent 51%) 0 0/173px 173px,radial-gradient(1px 1px at 90px 41px,rgba(200,220,255,.7) 50%,transparent 51%) 0 0/113px 113px,radial-gradient(0.8px 0.8px at 5px 61px,rgba(255,255,255,.5) 50%,transparent 51%) 0 0/79px 79px,radial-gradient(1px 1px at 120px 140px,rgba(230,210,255,.7) 50%,transparent 51%) 0 0/197px 197px,radial-gradient(1.4px 1.4px at 150px 30px,rgba(255,245,220,.8) 50%,transparent 51%) 0 0/241px 241px,radial-gradient(0.8px 0.8px at 44px 12px,rgba(255,255,255,.45) 50%,transparent 51%) 0 0/61px 61px; --mode:stars;
  --shadow:0 2px 0 rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:var(--deco)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font:15px/1.5 Manrope,"Segoe UI",Roboto,Arial,sans-serif;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 9%,var(--star) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 92% 34%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 41% 6%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 63% 22%,var(--star) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 4% 46%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 86% 61%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 27% 72%,var(--star) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 55% 88%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 96% 84%,var(--star) 50%,transparent 51%),
    radial-gradient(90% 50% at 50% -10%,var(--glow1),transparent 70%),
    radial-gradient(60% 45% at 100% 20%,var(--glow2),transparent 70%),
    radial-gradient(50% 40% at 0% 85%,var(--glow2),transparent 70%),
    radial-gradient(70% 35% at 50% 105%,var(--glow3),transparent 70%),
    var(--sky);
  background-repeat:no-repeat; background-attachment:fixed;}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:18px}
h1{font-family:Philosopher,Georgia,serif;font-weight:700;font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0;letter-spacing:.01em}
h1 .stars{color:var(--gold);font-size:.55em;vertical-align:.45em;margin-left:.3em;letter-spacing:.2em}
.sub{color:var(--muted);margin:4px 0 0;max-width:60ch}
.hstats{margin-left:auto;display:flex;gap:22px}
.hstat{text-align:right;color:var(--muted);font-size:14px}
.hstat b{color:var(--gold);font-family:Philosopher,Georgia,serif;font-size:26px;display:block;line-height:1}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.toolbar input[type=search]{flex:1 1 180px;min-width:140px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.toolbar select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.els{display:flex;gap:4px;flex-wrap:wrap}
.elbtn{width:30px;height:30px;border-radius:50%;border:none;padding:0;cursor:pointer;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1;letter-spacing:-.02em;opacity:.55;box-shadow:0 0 0 2px transparent}
.elbtn:hover{opacity:.85}
.els:not(:has([aria-pressed="true"])) .elbtn{opacity:1}
.elbtn[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;white-space:nowrap;cursor:pointer}
.tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700}
.btn.danger{color:#D0473F}
.legend{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:13px;margin:0 4px 14px}
.legend .lrow{display:flex;flex-wrap:wrap;gap:4px 16px}
.lcard{position:relative;display:inline-block;width:20px;height:15px;border-radius:4px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 40%,transparent);flex:none;overflow:hidden}
.lcard::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--line);opacity:.8}
.lcard::after{content:"";position:absolute;left:3px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.45;box-shadow:0 0 0 1.5px var(--panel)}
.legend span{display:inline-flex;align-items:center;gap:6px}

.board{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:118px 1fr;background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:84px}
.tlabel{display:grid;place-items:center;padding:6px;font-family:Philosopher,Georgia,serif;font-weight:700;font-size:17px;color:var(--bg)}
.tname{all:unset;display:inline-block;box-sizing:border-box;cursor:text;max-width:100%;text-align:center;line-height:1.15;overflow-wrap:normal;word-break:normal;padding:5px 5px;border-radius:8px;font:inherit;color:inherit}
.tname:hover{background:rgba(255,255,255,.2)}
.tname:hover::after{content:" ✎";font-size:.8em;opacity:.7}
.tname:focus-visible{outline:2px solid var(--bg);outline-offset:1px}
.tinput{width:100%;box-sizing:border-box;font:700 15px Philosopher,Georgia,serif;text-align:center;border-radius:8px;border:2px solid var(--bg);background:var(--panel);color:var(--text);padding:5px 4px}
.zone{display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start;align-items:flex-start;min-height:84px}
.zone.over{background:var(--panel2)}
.ach{margin-top:20px;background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px}
.ahead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.ahead h2{font-family:Philosopher,Georgia,serif;font-size:22px;margin:0;font-weight:700}
.ahead span{color:var(--muted);font-size:14px}
.apr{flex:1;max-width:220px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.apr i{display:block;height:100%;width:0;background:var(--gold);border-radius:3px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.ac{display:flex;gap:9px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px}
.ac .ai{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:17px;font-weight:700;line-height:1}
.ac .ai svg{width:20px;height:20px}
.ac b{display:block;font-size:13px;line-height:1.25}
.ac small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.ac.lk{background:transparent;border-style:dashed}
.ac.lk .ai{background:var(--line);color:var(--muted);opacity:.75}
.ac.lk .ai svg{filter:grayscale(1);opacity:.6}
.ac.lk b{color:var(--muted)}
.ac.new{animation:achpop .7s ease-out}
@keyframes achpop{0%{transform:scale(.9)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ac.new{animation:none}}
.pool{margin-top:22px}
.phead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.phead h2{margin:0!important;flex:1}
.ptoggle{display:none;padding:6px 12px;font-size:13px}
.psearch{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-bottom:8px}
@media (min-width:1000px){
  .wrap{max-width:1440px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:16px;align-items:start}
  .pool{margin-top:0;position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px - env(safe-area-inset-top,0px));display:flex;flex-direction:column}
  .pool .pbody{display:flex;flex-direction:column;min-height:0;flex:1}
  .pool .zone{overflow:auto;flex:1;min-height:120px;align-content:flex-start}
}
@media (max-width:999px){
  .ptoggle{display:inline-block}
  .pool.collapsed .pbody{display:none}
}
.pool h2{font-family:Philosopher,Georgia,serif;font-size:22px;margin:0 0 8px;font-weight:700}
.pool h2 small{font-family:Manrope,sans-serif;font-size:14px;color:var(--muted);font-weight:500;margin-left:8px}
.pool .zone{background:color-mix(in srgb,var(--panel) 70%,transparent);border:1px dashed var(--line);border-radius:14px;min-height:100px}
.empty{color:var(--muted);font-size:14px;padding:12px;align-self:center}

.card{position:relative;width:132px;min-height:66px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;
  padding:7px 9px 7px 13px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:2px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--el,#888);z-index:1}
.card.npc{border-style:dashed}
.card .band{margin:-7px -9px 0 -13px;height:42px;overflow:hidden;background:color-mix(in srgb,var(--el) 35%,var(--panel2))}
.card .band img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;pointer-events:none}
.card .ava{position:absolute;left:11px;top:16px;width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid var(--panel2);background:var(--line);z-index:2}
.card .ava.k4{border:3px solid var(--ring4)}
.card .ava.k5{border:3px solid var(--ring5)}
.card .ava.kL{border:2px solid var(--ring5);box-shadow:0 0 0 2px var(--panel2),0 0 0 4px var(--ring5)}
.card.no .ava.kL{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ring5)}
.card .nmrow .rw.k4{box-shadow:0 0 0 2px var(--ring4)}
.card .nmrow .rw.k5{box-shadow:0 0 0 2px var(--ring5)}
.card .nmrow .rw.kL{box-shadow:0 0 0 1.5px var(--ring5),0 0 0 3px var(--panel2),0 0 0 4.5px var(--ring5)}
.card.mchip .dot.k4{box-shadow:0 0 0 2px var(--ring4)}
.card.mchip .dot.k5{box-shadow:0 0 0 2px var(--ring5)}
.card.mchip .dot.kL{box-shadow:0 0 0 1.5px var(--ring5),0 0 0 3px var(--panel2),0 0 0 4.5px var(--ring5)}
.eava.k4{border-color:var(--ring4)}
.eava.k5{border-color:var(--ring5)}
.eava.kL{border-color:var(--ring5);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ring5)}
.card .ava.kS{border:2px dashed var(--muted)}
.card .nmrow .rw.kS{box-shadow:0 0 0 1.5px var(--panel2),0 0 0 3px var(--muted)}
.card.mchip .dot.kS{outline:1.5px dashed var(--muted);outline-offset:2px}
.eava.kS{border-style:dashed;border-color:var(--muted)}
.lr.kS{border:2px dashed var(--muted)}
.card .ava.kF{border:3px solid;border-color:var(--ring5) var(--ring4) var(--ring4) var(--ring5)}
.card .nmrow .rw.kF{position:relative;box-shadow:none}
.card .nmrow .rw.kF::after{content:"";position:absolute;inset:-3.5px;border-radius:50%;border:2px solid;border-color:var(--ring5) var(--ring4) var(--ring4) var(--ring5);pointer-events:none}
.card.mchip .dot.kF{border:2px solid;border-color:var(--ring5) var(--ring4) var(--ring4) var(--ring5)}
.eava.kF{border-color:var(--ring5) var(--ring4) var(--ring4) var(--ring5)}
.lr.kF{border:2.5px solid;border-color:var(--ring5) var(--ring4) var(--ring4) var(--ring5)}
.lr{width:14px;height:14px;border-radius:50%;display:inline-block;background:var(--line);box-sizing:border-box}
.lr.k4{border:2.5px solid var(--ring4)}.lr.k5{border:2.5px solid var(--ring5)}.lr.kL{border:2px solid var(--ring5);box-shadow:0 0 0 1.5px var(--panel),0 0 0 3px var(--ring5);margin:0 2px}
.card .ava img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;-webkit-user-drag:none;pointer-events:none}
.card.has-ava .nm{margin-top:25px;padding-right:0}
.card.has-band .nmrow{margin-top:5px}
.card.has-ava.has-band .nm{margin-top:25px}
.card.no .band img,.card.no .ava img{filter:grayscale(.9);opacity:.6}
.card .pic{margin:-7px -9px 5px -13px;height:104px;background:var(--line)}
.card .pic img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;-webkit-user-drag:none;pointer-events:none}
.card.no{background:transparent}
.card.no .pic img{filter:grayscale(.9);opacity:.6}
.card.no .nm{color:var(--muted)}
.card .nm{font-weight:700;font-size:13.5px;line-height:1.2;overflow-wrap:anywhere;padding-right:34px}

function compress(file,max,q){max=max||360;q=q||.8;
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error("read"))};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej(new Error("decode"))};
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
        var cv=document.createElement("canvas");cv.width=Math.round(w*k);cv.height=Math.round(h*k);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        var out=cv.toDataURL("image/webp",q);
        if(out.indexOf("data:image/webp")!==0)out=cv.toDataURL("image/jpeg",q);
        if(out.length>120000)out=cv.toDataURL("image/jpeg",.55);
        res(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function passes(c){
  var anyEl=Object.keys(F.el).some(function(k){return F.el[k]});
  if(anyEl&&!F.el[c.el])return false;
  if(F.wt&&c.wt!==F.wt)return false;
  if(F.rar&&String(c.rar)!==F.rar)return false;
  if(F.pl==="1"&&!c.pl)return false;
  if(F.pl==="0"&&(c.pl||c.soon))return false;
  if(F.pl==="s"&&!c.soon)return false;
  if(F.src==="lim"&&!(c.rar===5&&!c.src&&c.pl))return false;
  if(F.src==="std"&&!isStd(c))return false;
  if(F.src==="free"&&c.src!=="free")return false;
  if(F.own==="1"&&!S.own[c.id])return false;
  if(F.own==="0"&&S.own[c.id])return false;
  var w=S.wish[c.id];
  if(F.wish==="any"&&!w)return false;
  if(F.wish==="waifu"&&!(w&&w.why==="waifu"))return false;
  if(F.q&&c.name.toLowerCase().indexOf(F.q)<0&&TR(c.name).toLowerCase().indexOf(F.q)<0)return false;
  return true;
}

function achState(){
  var m=byId(),all=allChars(),own=all.filter(function(c){return S.own[c.id]});
  var x={m:m,all:all,own:own,waifu:Object.keys(S.wish).filter(function(id){return m[id]&&S.wish[id].why==="waifu"}).length};
  return ACH.map(function(a){var ok=false;try{ok=!!a.t(x)}catch(e){}return {a:a,ok:ok}});
}
function achIcon(a,big){return a.g==="gem"?GEM.replace(/width="14" height="14"/,big?'width="20" height="20"':'width="14" height="14"'):esc(a.g)}
var achInit=false,achPrev={};
function renderAch(){
  var st=achState(),got=st.filter(function(r){return r.ok});
  document.getElementById("achCount").textContent=got.length+" из "+ACH.length;
  document.getElementById("achBar").style.width=(got.length/ACH.length*100)+"%";
  var fresh=[];
  if(!PREVIEW){got.forEach(function(r){if(S.achSeen.indexOf(r.a.id)<0)fresh.push(r.a)});}
  document.getElementById("achGrid").innerHTML=st.map(function(r){var a=r.a,col=ACOL[a.c];
    return r.ok?'<div class="ac'+(achInit&&fresh.indexOf(a)>-1?" new":"")+'"><span class="ai" style="background:'+col[0]+';color:'+col[1]+'" aria-hidden="true">'+achIcon(a,true)+'</span><div><b>'+esc(a.n)+'</b><small>'+esc(a.d)+'</small></div></div>'
      :'<div class="ac lk"><span class="ai" aria-hidden="true">'+achIcon(a,true)+'</span><div><b>'+(art&&!PREVIEW?esc(a.n):"???")+'</b><small>'+(art&&!PREVIEW?esc(a.d)+" · видно только тебе":"Секретная ачивка")+'</small></div></div>'}).join("");
  if(fresh.length){
    if(achInit)toast(fresh.length===1?"Ачивка получена: "+fresh[0].n:"Новые ачивки: "+fresh.map(function(a){return a.n}).join(", "));
    fresh.forEach(function(a){S.achSeen.push(a.id)});
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    clearTimeout(saveT);saveT=setTimeout(dbWrite,800);
  }
  achInit=true;
}

  h+='<button type="button" class="qi own" role="menuitemcheckbox" aria-checked="'+own+'" data-a="own"><span class="ic">'+(own?"★":"☆")+'</span>'+(own?"Есть на аккаунте":"Вытащила!")+'</button>';
  h+='<div class="qsep"></div>';
  if(S.view==="matrix"){
    h+='<div class="qlab">На поле</div>';
    [["tr","Хочу и полезен"],["tl","Полезен, но не тянет"],["br","Хочу просто так"],["bl","Не нужен"]].forEach(function(q){h+='<button type="button" class="qi" role="menuitem" data-a="q" data-q="'+q[0]+'"><span class="ic">◦</span>'+q[1]+'</button>'});

    TIERS.forEach(function(x){h+='<button type="button" role="menuitemradio" aria-pressed="'+(t===x)+'" data-a="tier" data-t="'+x+'">'+esc(tierName(x))+'</button>'});
    h+='<button type="button" role="menuitemradio" aria-pressed="'+(!t)+'" data-a="tier" data-t="" title="Без тира">✕</button></div>';
  }

document.getElementById("qmenu").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||!qm)return;var id=qm,a=b.dataset.a,before=snap(),msg="",cel=false;
  if(a==="edit"){closeMenu();openEdit(id);return}
  if(a==="fav"){var w=S.wish[id];
    if(w&&w.why==="waifu"){w.why=null;if(w.auto&&!w.weap&&!w.note)delete S.wish[id];msg=nameOf(id)+": без ♥"}
    else{if(w)w.why="waifu";else S.wish[id]={c:0,weap:"",r:null,note:"",why:"waifu",auto:true};msg=nameOf(id)+": ♥"}}

  if(a==="q"){var q=b.dataset.q;if(q==="off"){delete S.matrix[id];msg=nameOf(id)+" убран с поля"}else{var j=function(){return (Math.random()-.5)*.16};S.matrix[id]={x:+((q[1]==="r"?.75:.25)+j()).toFixed(3),y:+((q[0]==="t"?.25:.75)+j()).toFixed(3)};msg=nameOf(id)+": "+b.textContent.replace(/^◦/,"")}}
  closeMenu();save();render();if(cel)setTimeout(function(){celebrate(id)},40);if(msg)offerUndo(before,msg);
});

// ---------- artifact farm of the day ----------
function todayKey(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var FARM_W={S:5,A:4,B:3,C:2,D:1,"":2};
function farmPool(){var m=byId(),out=[];allChars().forEach(function(c){if(!c.pl)return;var t=tierOf(c.id),own=!!S.own[c.id];if(own||t==="S"||t==="A")out.push({c:c,w:FARM_W[t]||2})});return out}
function farmPick(excl){var pool=farmPool();if(pool.length>1&&excl)pool=pool.filter(function(x){return x.c.id!==excl});var tot=pool.reduce(function(a,x){return a+x.w},0);if(!tot)return null;
  var r=Math.random()*tot;for(var i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0)return {id:pool[i].c.id,p:pool[i].w/tot}}return {id:pool[pool.length-1].c.id,p:pool[pool.length-1].w/tot}}
function closeGacha(){var g=document.querySelector(".gacha");if(g)g.remove()}
function showGacha(id,p,animate){
  closeGacha();var c=byId()[id];if(!c)return;
  var elc=(EL[c.el]||EL["?"]).c,sc=c.rar===5?"#F5C451":c.rar===4?"#B98BF0":"#86B4F2",av=IMG[id],bg=IMG["bg_"+id],t=tierOf(id),own=!!S.own[id];
  var g=document.createElement("div");g.className="gacha";g.setAttribute("role","dialog");g.setAttribute("aria-modal","true");g.setAttribute("aria-label","Кому фармим артефакты");
  g.style.setProperty("--sc",sc);g.style.setProperty("--elc",elc);g.style.setProperty("--el",elc);
  var card='<div class="gcard"><div class="gband">'+(bg?'<img alt="" src="'+esc(bg)+'">':"")+'</div>'+
    '<div class="eava '+kind(c)+'">'+(av?'<div class="ph2"><img alt="" src="'+esc(av)+'"></div>':esc(TR(c.name).charAt(0)))+rwHTML(c,"")+'</div>'+
    '<p class="gsub">Сегодня фармим артефакты для</p><h2 class="gname">'+esc(c.name)+'</h2>'+
    '<p class="gmeta">'+(t?"«"+esc(tierName(t))+"»":"Без тира")+(own?"":" · пока нет на аккаунте")+" · шанс "+Math.round(p*100)+"%</p>"+
    '<div class="gbtns"><button type="button" class="btn" id="gReroll">Перекрутить</button><button type="button" class="btn primary" id="gOk">Принято!</button></div></div>';
  g.innerHTML='<div class="gstar"></div><div class="gflash"></div>'+card+'<div class="gskip" id="gSkip">нажми, чтобы пропустить</div>';
  document.body.appendChild(g);
  var cd=g.querySelector(".gcard"),star=g.querySelector(".gstar"),fl=g.querySelector(".gflash"),skip=g.querySelector("#gSkip");
  function reveal(){if(g.dataset.done)return;g.dataset.done="1";star.remove();skip.remove();
    if(cd.animate&&animate)cd.animate([{opacity:0,transform:"scale(.85) translateY(20px)"},{opacity:1,transform:"scale(1.02)",offset:.7},{opacity:1,transform:"scale(1)"}],{duration:520,easing:"cubic-bezier(.2,.8,.3,1)",fill:"forwards"});else cd.style.opacity="1";
    var ok=g.querySelector("#gOk");if(ok)ok.focus({preventScroll:true})}
  g.querySelector("#gOk").onclick=closeGacha;
  g.querySelector("#gReroll").onclick=function(){var r=farmPick(id);if(!r)return;S.farm={id:r.id,date:todayKey(),p:r.p};save();showGacha(r.id,r.p,true)};
  g.addEventListener("keydown",function(e){if(e.key==="Escape")closeGacha()});
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!animate||reduce||!document.body.animate){reveal();return}
  g.addEventListener("click",function(e){if(!g.dataset.done&&!e.target.closest(".gbtns"))reveal()});
  g.animate([{opacity:0},{opacity:1}],{duration:300,fill:"forwards"});
  var W=innerWidth,H=innerHeight;
  star.animate([{transform:"translate("+(-60)+"px,"+(-60)+"px) scale(.6)",opacity:0},{transform:"translate("+(W*.2)+"px,"+(H*.15)+"px) scale(1)",opacity:1,offset:.25},{transform:"translate("+(W/2-4)+"px,"+(H/2-4)+"px) scale(1.4)",opacity:1}],{duration:1300,delay:250,easing:"cubic-bezier(.5,0,.75,.6)",fill:"forwards"});
  fl.animate([{opacity:0,transform:"scale(1)"},{opacity:1,transform:"scale(10)",offset:.4},{opacity:0,transform:"scale(26)"}],{duration:700,delay:1500,easing:"ease-out",fill:"forwards"});
  setTimeout(reveal,1780);
}
document.getElementById("farmBtn").onclick=function(){
  var tk=todayKey(),m=byId();
  if(S.farm&&S.farm.date===tk&&m[S.farm.id]){showGacha(S.farm.id,S.farm.p||0,false);return}
  var r=farmPick(null);
  if(!r){toast("Пока некого выбрать: отметь, кто есть на аккаунте, или поставь кого-нибудь в первые два тира");return}
  S.farm={id:r.id,date:tk,p:r.p};save();showGacha(r.id,r.p,true);
};

// ---------- guest preview ----------
function setPreview(on){
  if(on===PREVIEW)return;
  if(on){REAL=S;S=blank();S.view=REAL.view;PREVIEW=true}else{PREVIEW=false;S=REAL||S;REAL=null}
  document.getElementById("pvbar").hidden=!on;document.getElementById("pvBtn").hidden=on||!art;
  window.scrollTo(0,0);render();
}
document.getElementById("pvBtn").onclick=function(){setPreview(true)};
document.getElementById("pvExit").onclick=function(){setPreview(false)};

// ---------- celebration ----------
var SAYS=["Вытащила!","Наконец-то!","Добро пожаловать!","Есть!"];
function celebrate(id){
  var c=byId()[id];if(!c)return;
  var col=(EL[c.el]||EL["?"]).c,gold=getComputedStyle(document.documentElement).getPropertyValue("--gold").trim()||"#E8C77A";
  var card=document.querySelector('.card[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]:not(.ghost)'),x=innerWidth/2,y=innerHeight/2;
  if(card){var r=card.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight&&r.width){x=r.left+r.width/2;y=r.top+r.height/2}
    card.classList.remove("pop");void card.offsetWidth;card.classList.add("pop");setTimeout(function(){card.classList.remove("pop")},700)}
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!document.body.animate){toast(c.name+": "+SAYS[0]);return}
  var fx=document.createElement("div");fx.className="fx";document.body.appendChild(fx);
  var ring=document.createElement("div");ring.className="ring";ring.style.setProperty("--c",col);ring.style.left=x+"px";ring.style.top=y+"px";fx.appendChild(ring);
  ring.style.opacity="0";ring.animate([{transform:"scale(1)",opacity:.9},{transform:"scale(9)",opacity:0}],{duration:700,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"});
  var cols=[col,col,gold,"#ffffff"],n=30;
  for(var i=0;i<n;i++){
    var sp=document.createElement("span");sp.className="p";
    var star=i%3!==0;sp.textContent=star?"✦":"";
    var sz=star?10+Math.random()*12:5+Math.random()*4;
    if(star){sp.style.fontSize=sz+"px";sp.style.color=cols[i%cols.length]}else{sp.style.width=sp.style.height=sz+"px";sp.style.borderRadius="50%";sp.style.background=cols[i%cols.length]}
    fx.appendChild(sp);
    var a=Math.PI*2*i/n+Math.random()*.4,d=60+Math.random()*110,dx=Math.cos(a)*d,dy=Math.sin(a)*d-20,rot=(Math.random()-.5)*360;
    sp.animate([
      {transform:"translate("+(x-sz/2)+"px,"+(y-sz/2)+"px) scale(.3) rotate(0deg)",opacity:1},
      {transform:"translate("+(x+dx*.85-sz/2)+"px,"+(y+dy*.85-sz/2)+"px) scale(1) rotate("+rot*.7+"deg)",opacity:1,offset:.6},
      {transform:"translate("+(x+dx-sz/2)+"px,"+(y+dy+25-sz/2)+"px) scale(.6) rotate("+rot+"deg)",opacity:0}
    ],{duration:900+Math.random()*400,easing:"cubic-bezier(.15,.75,.3,1)",fill:"forwards"});
  }
  var say=document.createElement("div");say.className="say";say.textContent=SAYS[Math.floor(Math.random()*SAYS.length)];say.style.left=x+"px";say.style.top=(y-10)+"px";say.style.opacity="0";fx.appendChild(say);
  say.animate([{transform:"translate(-50%,-50%) scale(.6)",opacity:0},{transform:"translate(-50%,-110%) scale(1.05)",opacity:1,offset:.25},{transform:"translate(-50%,-190%) scale(1)",opacity:1,offset:.75},{transform:"translate(-50%,-230%) scale(1)",opacity:0}],{duration:1500,easing:"ease-out",fill:"forwards"});
  setTimeout(function(){fx.remove()},1700);
}
